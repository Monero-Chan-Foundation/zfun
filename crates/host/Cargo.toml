[package]
name = "zfun-host"
version = "0.1.0"
edition = "2024"

[dependencies]
eyre = "0.6.12"
rusqlite = "0.37.0"
monerochan = { path = "../../../monerochanrs-private/crates/sdk", features = ["network"] }
monerochan-runtime = { path = "../../../monerochanrs-private/crates/zkvm/entrypoint" }
zfun-host-lib = { path = "../host-lib" }
zfun-lib = { path = "../lib" }
zfun-elf = { path = "../elf" }
serde_json = "1.0"
tokio = { version = "1.40.0", features = ["rt-multi-thread"] }
hex = "0.4.3"
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
