[package]
name = "zfun-host-lib"
edition.workspace = true
version.workspace = true

[features]
default = []
snapshot-witness = []

[dependencies]
shard-builder = { path = "../shard-builder" }
eyre = "0.6.12"
hex = "0.4"
log = "0.4.28"
orchard = { version = "0.11.0", default-features = false }
rand = "0.8.5"
rusqlite = { version = "0.37.0" }
sapling-crypto = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = "1.7"
zcash_client_backend = { version = "0.21.0" }
zcash_client_sqlite = { version = "0.19.0", features = ["orchard", "transparent-inputs"] }
zcash_primitives = "0.26.1"
zcash_protocol = "0.7.1"
shardtree = "0.6.1"
zfun-lib = { path = "../lib" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12.24", features = ["json", "rustls-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3.8"
